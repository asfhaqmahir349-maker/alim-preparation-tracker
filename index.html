function home(){let p=percent();$("#view").innerHTML=`<div class="grid"><div class="card"><div class="muted">সামগ্রিক অগ্রগতি</div><div class="big">${p}%</div><div class="bar"><span style="width:${p}%"></span></div></div><div class="card"><div class="muted">সম্পন্ন কাজ</div><div class="big">${completed()}</div><div class="muted">মোট ${allTasks().length} কাজ</div></div><div class="card"><div class="muted">বিষয়</div><div class="big">${syllabus.length}</div><div class="muted">সিলেবাস তালিকা</div></div></div><div class="card"><h3>পরীক্ষার কাউন্টডাউন</h3><div id="miniCountdown" class="big">তারিখ সেট করো</div><button class="btn soft" onclick="show('countdown')">তারিখ সেট / দেখুন</button></div><div class="card quote"><b>মোটিভেশন</b><br>পরিশ্রমে চোখের নিচে কালি জমবে ,<br>পিঠের ব্যথায় টনটন করবে,  রাত পেরিয়ে ভোর হবে,<br>তবুও থেমে থাকা যাবে না<br><br>— রিয়াদ ভাইয়া _</div><div class="row"><h2>বিষয়সমূহ</h2><button class="btn primary" onclick="show('subjects')">সব বিষয় দেখো</button></div><div class="subject-list">${syllabus.slice(0,6).map(s=>`<div class="card subject" onclick="openSubject('${esc(s.name)}')"><h3>${esc(s.name)}</h3><div class="muted">${s.sections.reduce((n,x)=>n+x.topics.length,0)}টি টপিক</div></div>`).join("")}</div>`;updateCountdown()}
function subjects(){$("#view").innerHTML=`<h2>বিষয়সমূহ ও সিলেবাস</h2><div class="subject-list">${syllabus.map(s=>`<div class="card subject" onclick="openSubject('${esc(s.name)}')"><h3>${esc(s.name)}</h3><div class="muted">${s.sections.reduce((a,x)=>a+x.topics.length,0)}টি টপিক</div></div>`).join("")}</div>`}
function openSubject(name){let s=syllabus.find(x=>x.name===name);let h=`<div class="row"><h2>${esc(s.name)}</h2><button class="btn soft" onclick="subjects()">← বিষয় তালিকা</button></div>`;s.sections.forEach(sec=>{h+=`<div class="card"><h3>${esc(sec.name)}</h3>`;sec.topics.forEach(t=>{let badge=Array.isArray(sec.badges?.[t])?sec.badges[t]:(sec.badges?.[t]?[sec.badges[t]]:sec.badge?[sec.badge]:[]);let key=taskKey(s.name,sec.name,t);let list=getTasks(key),done=list.length&&list.every(x=>x.done);h+=`<div class="topic"><label><b>${esc(t)}</b><br>${badge.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}<small class="muted"> · ${list.filter(x=>x.done).length}/${list.length} কাজ</small></label><button class="btn soft" onclick="openTopic('${esc(s.name)}','${esc(sec.name)}','${esc(t)}')">কাজ / টিক</button></div>`});h+="</div>"});$("#view").innerHTML=h}
function openTopic(s,sec,t){currentTopic={s,sec,t};let k=taskKey(s,sec,t),a=getTasks(k);$("#modalContent").innerHTML=`<h2>${esc(t)}</h2><p class="muted">${esc(s)} · ${esc(sec)}</p><h3>নিজের পড়ার কাজ</h3><div>${a.map((x,i)=>`<div class="topic"><input type="checkbox" ${x.done?"checked":""} onchange="toggleTask(${i},this.checked)"><label style="${x.done?"text-decoration:line-through;opacity:.6":""}">${esc(x.text)}</label><button class="btn danger" onclick="deleteTask(${i})">মুছো</button></div>`).join("")||'<p class="empty">এখনো কাজ যোগ করা হয়নি।</p>'}</div><form id="taskForm"><input id="taskInput" class="field" required placeholder="নতুন কাজ লিখো"><button class="btn primary">+ কাজ যোগ করো</button></form>`;$("#modal").classList.remove("hidden");$("#taskForm").onsubmit=e=>{e.preventDefault();a.push({text:$("#taskInput").value.trim(),done:false});state.tasks[k]=a;save();openTopic(s,sec,t)}}
function toggleTask(i,v){let a=getTasks(taskKey(currentTopic.s,currentTopic.sec,currentTopic.t));a[i].done=v;state.tasks[taskKey(currentTopic.s,currentTopic.sec,currentTopic.t)]=a;save();openTopic(currentTopic.s,currentTopic.sec,currentTopic.t)}
function deleteTask(i){let k=taskKey(currentTopic.s,currentTopic.sec,currentTopic.t),a=getTasks(k);a.splice(i,1);state.tasks[k]=a;save();openTopic(currentTopic.s,currentTopic.sec,currentTopic.t)}
function routine(){let r=state.routine;$("#view").innerHTML=`<h2>২৪ ঘণ্টার রুটিন</h2><div class="card"><p class="muted">সময় অনুযায়ী রিমাইন্ডার পাওয়ার জন্য ব্রাউজার নোটিফিকেশনের অনুমতি লাগবে। পেজ/ব্রাউজার বন্ধ থাকলে সব ফোনে নোটিফিকেশন নির্ভরযোগ্যভাবে নাও আসতে পারে।</p><button class="btn soft" onclick="requestNotify()">নোটিফিকেশন অনুমতি চালু</button><form id="routineForm"><label>সময়</label><input class="field" type="time" id="rtime" required><label>কাজ / পড়ার বিষয়</label><input class="field" id="rtask" required placeholder="যেমন: আরবি ১ম পত্র পড়া"><label>রিমাইন্ডার</label><select class="field" id="rrem"><option value="0">সময় হলেই</option><option value="5">৫ মিনিট আগে</option><option value="10">১০ মিনিট আগে</option><option value="15">১৫ মিনিট আগে</option></select><button class="btn primary">রুটিনে যোগ করো</button></form></div><div class="card">${r.length?r.sort((a,b)=>a.time.localeCompare(b.time)).map((x,i)=>`<div class="routine-row"><b>${x.time}</b><span>${esc(x.task)}<small class="muted"> · ${x.reminder||0} মিনিট আগে</small></span><button class="btn danger" onclick="removeRoutine(${i})">মুছো</button></div>`).join(""):'<p class="empty">এখনো রুটিন নেই। সময় ও কাজ যোগ করো।</p>'}</div>`;$("#routineForm").onsubmit=e=>{e.preventDefault();r.push({time:$("#rtime").value,task:$("#rtask").value.trim(),reminder:Number($("#rrem").value)});r.sort((a,b)=>a.time.localeCompare(b.time));save();routine()}}
function requestNotify(){if(!("Notification"in window)){alert("এই ব্রাউজারে নোটিফিকেশন সমর্থিত নয়।");return}Notification.requestPermission().then(p=>alert(p==="granted"?"নোটিফিকেশন অনুমতি হয়েছে।":"অনুমতি পাওয়া যায়নি।"))}
function removeRoutine(i){state.routine.splice(i,1);save();routine()}
function report(){let p=percent();$("#view").innerHTML=`<h2>অগ্রগতি প্রতিবেদন</h2><div class="card"><div class="big">${p}%</div><div>${completed()} / ${allTasks().length} কাজ সম্পন্ন</div><div class="bar"><span style="width:${p}%"></span></div></div><div class="grid">${syllabus.map(s=>{let items=Object.entries(state.tasks).filter(([k])=>k.startsWith(s.name+"::")).flatMap(([k,v])=>v),d=items.filter(x=>x.done).length;return `<div class="card"><b>${esc(s.name)}</b><div class="muted">${d}/${items.length} কাজ</div><div class="bar"><span style="width:${items.length?d/items.length*100:0}%"></span></div></div>`}).join("")}</div>`}
function countdown(){$("#view").innerHTML=`<h2>পরীক্ষার কাউন্টডাউন</h2><div class="card"><label>পরীক্ষার নাম</label><input id="examLabel" class="field" value="${esc(state.examLabel||"আলিম পরীক্ষা")}"><label>পরীক্ষার তারিখ ও সময়</label><input id="examDate" type="datetime-local" class="field" value="${esc(state.examDate||"")}"><button class="btn primary" onclick="saveExam()">সংরক্ষণ</button><div class="big" id="countdownDisplay" style="margin-top:16px">তারিখ সেট করো</div><p class="muted">কাউন্টডাউন দিন, ঘণ্টা, মিনিট ও সেকেন্ডে চলবে।</p></div>`;updateCountdown()}
function saveExam(){state.examLabel=$("#examLabel").value;state.examDate=$("#examDate").value;save();updateCountdown()}
function updateCountdown(){let el=$("#countdownDisplay")||$("#miniCountdown");if(!el)return;if(!state.examDate){el.textContent="পরীক্ষার তারিখ সেট করো";return}let diff=new Date(state.examDate).getTime()-Date.now();if(diff<=0){el.textContent="পরীক্ষার সময় এসে গেছে!";return}let d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);el.textContent=`${state.examLabel||"পরীক্ষা"}: ${d} দিন ${h} ঘণ্টা ${m} মিনিট ${s} সেকেন্ড`}
function settings(){$("#view").innerHTML=`<h2>সেটিংস ও ব্যাকআপ</h2><div class="card"><h3>ব্যাকআপ</h3><p class="muted">এই ডিভাইসের পড়ার কাজ, রুটিন ও পরীক্ষার তারিখ JSON ফাইলে সংরক্ষণ করো।</p><button class="btn primary" onclick="exportBackup()">ব্যাকআপ ডাউনলোড</button><label class="btn soft">ব্যাকআপ ফিরিয়ে আনো<input type="file" accept="application/json" hidden onchange="importBackup(event)"></label></div><div class="card"><h3>ডেটা সংরক্ষণ</h3><p class="muted">ডেটা এই ব্রাউজারের Local Storage-এ রাখা হয়। অন্য ডিভাইসে স্বয়ংক্রিয় সিঙ্ক নেই।</p><button class="btn danger" onclick="clearData()">সব ডেটা মুছো</button></div>`}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="alim-tracker-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data.tasks||!Array.isArray(data.routine))throw 0;state=data;save();show("home");alert("ব্যাকআপ ফিরিয়ে আনা হয়েছে।")}catch{alert("ফাইলটি বৈধ ব্যাকআপ নয়।")}};reader.readAsText(f)}
function clearData(){if(confirm("সব সংরক্ষিত ডেটা মুছে ফেলবে?")){localStorage.removeItem(K);location.reload()}}
$("#close").onclick=()=>$("#modal").classList.add("hidden");$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.add("hidden")};$("#theme").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";save();setTheme()};$("#menu").onclick=()=>document.querySelector(".layout").classList.toggle("menu-open");document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{document.querySelector(".layout").classList.remove("menu-open");show(b.dataset.view)});
setTheme();show("home");setInterval(updateCountdown,1000);
</script></body></html>
